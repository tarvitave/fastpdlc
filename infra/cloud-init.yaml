#cloud-config
# Runs once on first boot. Leaves a server that only needs `deploy.sh` and a .env.

users:
  - name: ${deploy_user}
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - rsync
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  # Security updates install themselves; reboot at 4am only if one demands it.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/51unattended-upgrades-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  # Password logins off. Key auth only.
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h

runcmd:
  # Docker, from Docker's own repository rather than the distro's older build.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${deploy_user}
  - systemctl enable --now docker

  # A host firewall behind the Hetzner cloud firewall. Belt and braces.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable

  - systemctl enable --now fail2ban
  - systemctl restart ssh

  # Where deploy.sh rsyncs to.
  - mkdir -p ${remote_dir}
  - chown -R ${deploy_user}:${deploy_user} ${remote_dir}

  - touch /var/lib/cloud-init-finished-marker

final_message: "fastpdlc host ready after $UPTIME seconds"
