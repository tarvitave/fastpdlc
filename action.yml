# Reusable GitHub Action: run the FastPDLC product-as-code gate in any repo.
#
#   - uses: tarvitave/fastpdlc@v0.4.0
#     with:
#       config: product.config.yaml     # optional (this is the default)
#       plugin: scripts/product_hooks.py # optional project-specific checks
#       version: "0.4.0"                 # optional pin; empty = latest on PyPI
#
# It installs FastPDLC and runs `fastpdlc … validate`, whose exit code is the gate.
name: 'FastPDLC validate'
description: 'Validate product-as-code as a typed, referenced, non-stale graph with FastPDLC.'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  config:
    description: 'Path to the FastPDLC config (product.config.yaml).'
    required: false
    default: 'product.config.yaml'
  root:
    description: 'Project root that paths resolve from (fastpdlc -C).'
    required: false
    default: '.'
  plugin:
    description: 'Optional plugin module or .py file (fastpdlc -p) for project-specific checks.'
    required: false
    default: ''
  version:
    description: 'FastPDLC version to install, e.g. "0.4.0". Empty installs the latest on PyPI.'
    required: false
    default: ''
  python-version:
    description: 'Python to set up for the run.'
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install FastPDLC
      shell: bash
      run: |
        set -euo pipefail
        spec="fastpdlc"
        if [ -n "${{ inputs.version }}" ]; then spec="fastpdlc==${{ inputs.version }}"; fi
        python -m pip install --upgrade "$spec"

    - name: Validate product-as-code
      shell: bash
      run: |
        set -euo pipefail
        args=(-c "${{ inputs.config }}" -C "${{ inputs.root }}")
        if [ -n "${{ inputs.plugin }}" ]; then args+=(-p "${{ inputs.plugin }}"); fi
        fastpdlc "${args[@]}" validate
