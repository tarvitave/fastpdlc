[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastpdlc"
version = "0.6.2"
description = "Product-as-code as a validated graph — for any project."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
authors = [{ name = "tarvitave" }]
keywords = ["product-as-code", "pdlc", "docs-as-code", "validation", "product-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The reasoning stations. Core validation never needs this.
agents = ["anthropic>=0.40"]

[project.scripts]
fastpdlc = "fastpdlc.cli:main"

[project.urls]
Homepage = "https://github.com/tarvitave/fastpdlc"
Issues = "https://github.com/tarvitave/fastpdlc/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastpdlc"]

# The sdist defaults to "everything not gitignored", which shipped the whole
# marketing site, the Terraform and the deploy config to PyPI. Nothing secret was
# in them -- but a published artifact should not depend on a .gitignore staying
# correct forever. One forgotten .env in site/ would be public and unrecallable,
# because a PyPI version can be yanked but never replaced.
#
# So the sdist is an allowlist: the package, its tests, and the docs a packager
# needs. Anything operational stays in git and out of the tarball.
[tool.hatch.build.targets.sdist]
only-include = [
  "fastpdlc",
  "tests",
  "examples",
  "template",
  "action.yml",
  "copier.yml",
  "README.md",
  "CHANGELOG.md",
  "RELEASING.md",
  "LICENSE",
  "pyproject.toml",
]


[tool.pytest.ini_options]
markers = [
  "integration: talks to a real model; needs ANTHROPIC_API_KEY and costs money",
]
# Integration tests are opt-in: `pytest -m integration` to include them.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately not the kitchen sink. Each of these has caught something real in
# this codebase or would have: unused imports, shadowed builtins, mutable default
# arguments, bare excepts, f-strings that are not.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter, not the linter
  "SIM108",  # ternaries are not always clearer than an if
  "B008",    # FastAPI's Depends()/Form() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # imports inside tests are deliberate and local

[tool.coverage.run]
source = ["fastpdlc"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# A floor, not a target. It exists to stop coverage silently rotting, not to be
# gamed upward -- the modules that matter are already well above it.
fail_under = 85
show_missing = true
