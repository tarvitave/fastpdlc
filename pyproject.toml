[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastpdlc"
version = "0.2.0"
description = "Product-as-code as a validated graph — for any project."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
authors = [{ name = "tarvitave" }]
keywords = ["product-as-code", "pdlc", "docs-as-code", "validation", "product-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The reasoning stations. Core validation never needs this.
agents = ["anthropic>=0.40"]

[project.scripts]
fastpdlc = "fastpdlc.cli:main"

[project.urls]
Homepage = "https://github.com/tarvitave/fastpdlc"
Issues = "https://github.com/tarvitave/fastpdlc/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastpdlc"]
