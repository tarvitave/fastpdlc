name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check fastpdlc tests scripts
      - name: Secret scan
        run: python scripts/check_no_secrets.py

      - name: Unit tests with a coverage floor
        run: |
          pip install coverage
          coverage run -m pytest -q
          coverage report
      - name: Site structure gate
        run: python site/tools/check_site.py

      - name: Dogfood — the blog must validate as product-as-code
        run: |
          cd site/content
          fastpdlc build
          git diff --exit-code build/             || { echo "::error::blog bundle is stale — run fastpdlc build"; exit 1; }
          fastpdlc validate

      - name: Dogfood — the quickstart example must validate
        run: |
          fastpdlc -C examples/quickstart build
          git diff --exit-code examples/quickstart/build/ \
            || { echo "::error::quickstart bundle is stale — run fastpdlc build"; exit 1; }
          fastpdlc -C examples/quickstart validate
