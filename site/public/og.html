<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FastPDLC — social card</title>
<link rel="stylesheet" href="/styles.css?v=283011667f">
<style>
  /* Exactly the OG card size. Render this page to og.png at 1200x630. */
  html, body { background: #fff; }
  body { background-image: radial-gradient(#e5e5e5 1.6px, transparent 1.6px); background-size: 26px 26px; }
  .og {
    width: 1200px; height: 630px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 56px 64px; gap: 24px;
  }
  .og h1 { font-family: var(--display); font-size: 104px; line-height: 0.94; max-width: 16ch; }
  .og .hl { padding-inline: 0.08em;
    background-image: linear-gradient(transparent 52%, var(--yellow) 52%, var(--yellow) 88%, transparent 88%); }
  .og p { font-size: 27px; font-weight: 500; max-width: 30ch; color: #333; }
  .og-top { display: flex; align-items: center; justify-content: space-between; }
  .og-top .logo-mark { font-size: 34px; padding: 10px 16px; }
  .og-codes { display: flex; gap: 12px; }
  .og-codes span {
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: 9px;
    box-shadow: 3px 3px 0 var(--ink); background: #fff;
  }
  .og-bottom { display: flex; align-items: center; justify-content: space-between; }
  .og-bottom code {
    font-family: var(--mono); font-size: 25px; font-weight: 600;
    padding: 14px 20px; background: var(--ink); color: var(--yellow);
    border-radius: 10px;
  }
  .og-bottom .dom { font-family: var(--display); font-size: 30px; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="og">
  <div class="og-top">
    <span class="logo-mark">FASTPDLC</span>
    <div class="og-codes">
      <span style="background:#ff6b4a">PAC-001</span>
      <span style="background:#4a90e2">PAC-020</span>
      <span style="background:#fbcc00">PAC-060</span>
    </div>
  </div>

  <div>
    <h1>Your product spec, <span class="hl">compiled.</span></h1>
    <p style="margin-top:22px">Typed artifacts, a validated reference graph, and a CI gate that
      goes red the moment your spec and your product disagree.</p>
  </div>

  <div class="og-bottom">
    <code>pip install fastpdlc</code>
    <span class="dom">fastpdlc.com</span>
  </div>
</div>
</body>
</html>
