# The fastpdlc.com blog, as product-as-code.
#
# The blog you are reading is compiled by the tool it describes. Posts are typed
# artifacts: ids must match filenames, categories must be in the allowed set, and
# every `related` link must resolve to a real post. `fastpdlc validate` gates it,
# so a broken cross-link fails CI instead of shipping a dead link.
product_dir: .
output: build/blog.generated.json
types:
  - name: posts
    dir: posts
    id_prefix: "POST-"
    required: [id, title, slug, date, summary, author, category]
    fields: [title, slug, date, summary, author, category, tags, related, reading_minutes]
    enums:
      category: [concept, practice, reference, case-study]
    references:
      - field: related        # every related post must exist
        to: posts
